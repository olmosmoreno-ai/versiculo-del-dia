<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Versículo del día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#12141c;
    --ink-800:#1c2029;
    --ink-700:#2a2f3b;
    --parchment:#eee6d6;
    --parchment-dim:#c9c0ab;
    --gold:#c9a45c;
    --gold-soft:#e2c88a;
    --ember:#8b3a3a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 60% 45% at 50% 18%, rgba(201,164,92,0.10), transparent 60%),
      var(--ink-900);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
  }
  @media (prefers-reduced-motion: no-preference){
    .flame{animation:flicker 3.2s ease-in-out infinite;}
  }
  @keyframes flicker{
    0%,100%{opacity:.55; transform:scale(1);}
    35%{opacity:.85; transform:scale(1.06);}
    60%{opacity:.65; transform:scale(0.97);}
    80%{opacity:.9; transform:scale(1.03);}
  }
  .page{
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--parchment-dim);
    margin-bottom:28px;
  }
  .seal{
    position:relative;
    width:104px;
    height:104px;
    border-radius:50%;
    border:1px solid rgba(201,164,92,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:30px;
  }
  .seal::before{
    content:'';
    position:absolute;
    inset:-14px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(201,164,92,0.35), transparent 70%);
    filter:blur(2px);
  }
  .seal .flame{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(226,200,138,0.55), transparent 65%);
  }
  .seal-date{
    position:relative;
    z-index:1;
    font-family:'Fraunces',serif;
    font-size:15px;
    font-weight:600;
    color:var(--gold-soft);
    line-height:1.15;
  }
  .seal-date span{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:9px;
    letter-spacing:.18em;
    font-weight:500;
    color:var(--parchment-dim);
    margin-bottom:3px;
    text-transform:uppercase;
  }
  .verse-wrap{
    position:relative;
    padding:6px 4px 0;
  }
  .dropcap{
    float:left;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:64px;
    line-height:.78;
    padding:6px 8px 0 0;
    background:linear-gradient(160deg, var(--gold-soft), var(--gold) 55%, var(--ember) 130%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .verse{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:400;
    font-size:23px;
    line-height:1.5;
    color:var(--parchment);
    text-align:left;
  }
  .verse::after{content:'';display:block;clear:both;}
  .rule{
    width:46px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    margin:26px 0 16px;
  }
  .reference{
    font-family:'Inter',sans-serif;
    font-size:13px;
    letter-spacing:.06em;
    color:var(--gold-soft);
    font-weight:500;
  }
  .note{
    margin-top:34px;
    font-size:11.5px;
    line-height:1.6;
    color:var(--parchment-dim);
    max-width:360px;
  }
  .refresh{
    margin-top:22px;
    background:none;
    border:1px solid rgba(238,230,214,0.18);
    color:var(--parchment-dim);
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:.03em;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color .2s ease, color .2s ease;
  }
  .refresh:hover, .refresh:focus-visible{
    border-color:rgba(201,164,92,0.6);
    color:var(--gold-soft);
    outline:none;
  }
  .refresh:focus-visible{box-shadow:0 0 0 3px rgba(201,164,92,0.25);}
</style>
</head>
<body>
  <main class="page">
    <div class="eyebrow">Nuevo Testamento</div>
    <div class="seal">
      <div class="flame"></div>
      <div class="seal-date"><span id="weekday"></span><span id="daynum"></span></div>
    </div>
    <div class="verse-wrap">
      <p class="verse" id="verse"></p>
    </div>
    <div class="rule"></div>
    <p class="reference" id="reference"></p>
    <button class="refresh" id="refresh" aria-label="Ver otro versículo al azar">Ver otro versículo</button>
    <p class="note">365 versículos, uno distinto cada día del año. Texto literal de la Biblia Reina-Valera 1909 (dominio público), con su ortografía original.</p>
  </main>

  ["Romanos 12:21", "No seas vencido de lo malo; mas vence con el bien el mal."],
  ["Lucas 6:36", "Sed pues misericordiosos, como también vuestro Padre es misericordioso."],
  ["1 Timoteo 6:10", "Porque el amor del dinero es la raíz de todos los males: el cual codiciando algunos, se descaminaron de la fe, y fueron traspasados de muchos dolores."],
  ["Lucas 6:37", "No juzguéis, y no seréis juzgados: no condenéis, y no seréis condenados: perdonad, y seréis perdonados."],
  ["Mateo 5:13", "Vosotros sois la sal de la tierra: y si la sal se desvaneciere ¿con qué será salada? no vale más para nada, sino para ser echada fuera y hollada de los hombres."],
  ["Juan 12:26", "Si alguno me sirve, sígame: y donde yo estuviere, allí también estará mi servidor. Si alguno me sirviere, mi Padre le honrará."],
  ["Filipenses 4:11", "No lo digo en razón de indigencia, pues he aprendido á contentarme con lo que tengo."],
  ["1 Tesalonicenses 5:15", "Mirad que ninguno dé á otro mal por mal; antes seguid lo bueno siempre los unos para con los otros, y para con todos."],
  ["Juan 10:10", "El ladrón no viene sino para hurtar, y matar, y destruir: yo he venido para que tengan vida, y para que la tengan en abundancia."],
  ["Mateo 6:34", "Así que, no os congojéis por el día de mañana; que el día de mañana traerá su fatiga: basta al día su afán."],
  ["Mateo 24:35", "El cielo y la tierra pasarán, mas mis palabras no pasarán."],
  ["Lucas 6:38", "Dad, y se os dará; medida buena, apretada, remecida, y rebosando darán en vuestro seno: porque con la misma medida que midiereis, os será vuelto á medir."],
  ["Gálatas 5:1", "Estad, pues, firmes en la libertad con que Cristo nos hizo libres, y no volváis otra vez á ser presos en el yugo de servidumbre."],
  ["Juan 6:47", "De cierto, de cierto os digo: El que cree en mí, tiene vida eterna."],
  ["Romanos 5:8", "Mas Dios encarece su caridad para con nosotros, porque siendo aún pecadores, Cristo murió por nosotros."],
  ["Lucas 2:10-11", "Mas el ángel les dijo: No temáis; porque he aquí os doy nuevas de gran gozo, que será para todo el pueblo: Que os ha nacido hoy, en la ciudad de David, un Salvador, que es CRISTO el Señor."],
  ["1 Corintios 2:9", "Antes, como está escrito: Cosas que ojo no vió, ni oreja oyó, ni han subido en corazón de hombre, son las que ha Dios preparado para aquellos que le aman."],
  ["1 Pedro 5:6", "Humillaos pues bajo la poderosa mano de Dios, para que él os ensalce cuando fuere tiempo;"],
  ["Filipenses 1:21", "Porque para mí el vivir es Cristo, y el morir es ganancia."],
  ["Marcos 11:25", "Y cuando estuviereis orando, perdonad, si tenéis algo contra alguno, para que vuestro Padre que está en los cielos os perdone también á vosotros vuestras ofensas."],
  ["Efesios 4:2-3", "Con toda humildad y mansedumbre, con paciencia soportando los unos á los otros en amor; solícitos á guardar la unidad del Espíritu en el vínculo de la paz."],
  ["Mateo 5:9", "Bienaventurados los pacificadores: porque ellos serán llamados hijos de Dios."],
  ["Hebreos 10:24", "Y considerémonos los unos á los otros para provocarnos al amor y á las buenas obras;"],
  ["Romanos 12:2", "Y no os conforméis á este siglo; mas reformaos por la renovación de vuestro entendimiento, para que experimentéis cuál sea la buena voluntad de Dios, agradable y perfecta."],
  ["2 Timoteo 4:7", "He peleado la buena batalla, he acabado la carrera, he guardado la fe."],
  ["1 Juan 3:16", "En esto hemos conocido el amor, porque él puso su vida por nosotros: también nosotros debemos poner nuestras vidas por los hermanos."],
  ["Apocalipsis 21:4", "Y limpiará Dios toda lágrima de los ojos de ellos; y la muerte no será más; y no habrá más llanto, ni clamor, ni dolor: porque las primeras cosas son pasadas."],
  ["Juan 10:27-28", "Mis ovejas oyen mi voz, y yo las conozco, y me siguen; y yo les doy vida eterna: y no perecerán para siempre, ni nadie las arrebatará de mi mano."],
  ["Hechos 4:12", "Y en ningún otro hay salud; porque no hay otro nombre debajo del cielo, dado á los hombres, en que podamos ser salvos."],
  ["1 Pedro 2:9", "Mas vosotros sois linaje escogido, real sacerdocio, gente santa, pueblo adquirido, para que anunciéis las virtudes de aquel que os ha llamado de las tinieblas á su luz admirable:"],
  ["2 Corintios 5:17", "De modo que si alguno está en Cristo, nueva criatura es: las cosas viejas pasaron; he aquí todas son hechas nuevas."],
  ["Efesios 4:29", "Ninguna palabra torpe salga de vuestra boca, sino la que sea buena para edificación, para que dé gracia á los oyentes."],
  ["Marcos 11:24", "Por tanto, os digo que todo lo que orando pidiereis, creed que lo recibiréis, y os vendrá."],
  ["Romanos 13:8", "No debáis á nadie nada, sino amaros unos á otros; porque el que ama al prójimo, cumplió la ley."],
  ["Romanos 3:23-24", "Por cuanto todos pecaron, y están destituídos de la gloria de Dios; siendo justificados gratuitamente por su gracia, por la redención que es en Cristo Jesús;"],
  ["1 Juan 4:4", "Hijitos, vosotros sois de Dios, y los habéis vencido; porque el que en vosotros está, es mayor que el que está en el mundo."],
  ["Mateo 16:26", "Porque ¿de qué aprovecha al hombre, si granjeare todo el mundo, y perdiere su alma? O ¿qué recompensa dará el hombre por su alma?"],
  ["Santiago 1:12", "Bienaventurado el varón que sufre la tentación; porque cuando fuere probado, recibirá la corona de vida, que Dios ha prometido á los que le aman."],
  ["Hebreos 13:8", "Jesucristo es el mismo ayer, y hoy, y por los siglos."],
  ["Juan 6:35", "Y Jesús les dijo: Yo soy el pan de vida: el que á mí viene, nunca tendrá hambre; y el que en mí cree, no tendrá sed jamás."],
  ["Juan 8:36", "Así que, si el Hijo os libertare, seréis verdaderamente libres."],
  ["Gálatas 5:14", "Porque toda la ley en aquesta sola palabra se cumple: Amarás á tu prójimo como á ti mismo."],
  ["Romanos 8:28", "Y sabemos que á los que á Dios aman, todas las cosas les ayudan á bien, es á saber, á los que conforme al propósito son llamados."],
  ["1 Corintios 13:1", "Si yo hablase lenguas humanas y angélicas, y no tengo caridad, vengo á ser como metal que resuena, ó címbalo que retiñe."],
  ["Mateo 5:7", "Bienaventurados los misericordiosos: porque ellos alcanzarán misericordia."],
  ["Juan 13:35", "En esto conocerán todos que sois mis discípulos, si tuviereis amor los unos con los otros."],
  ["Juan 12:46", "Yo la luz he venido al mundo, para que todo aquel que cree en mí no permanezca en tinieblas."],
  ["Mateo 6:6", "Mas tú, cuando oras, éntrate en tu cámara, y cerrada tu puerta, ora á tu Padre que está en secreto; y tu Padre que ve en secreto, te recompensará en público."],
  ["Mateo 6:26", "Mirad las aves del cielo, que no siembran, ni siegan, ni allegan en alfolíes; y vuestro Padre celestial las alimenta. ¿No sois vosotros mucho mejores que ellas?"],
  ["1 Corintios 16:14", "Todas vuestras cosas sean hechas con caridad."],
  ["Mateo 10:29-31", "¿No se venden dos pajarillos por un cuarto? Con todo, ni uno de ellos cae á tierra sin vuestro Padre. Pues aun vuestros cabellos están todos contados. Así que, no temáis: más valéis vosotros que muchos pajarillos."],
  ["Filipenses 4:13", "Todo lo puedo en Cristo que me fortalece."],
  ["Juan 14:27", "La paz os dejo, mi paz os doy: no como el mundo la da, yo os la doy. No se turbe vuestro corazón, ni tenga miedo."],
  ["Filipenses 4:4", "Gozaos en el Señor siempre: otra vez digo: Que os gocéis."],
  ["Hebreos 10:23", "Mantengamos firme la profesión de nuestra fe sin fluctuar; que fiel es el que prometió:"],
  ["Marcos 1:15", "Y diciendo: El tiempo es cumplido, y el reino de Dios está cerca: arrepentíos, y creed al evangelio."],
  ["Juan 15:9", "Como el Padre me amó, también yo os he amado: estad en mi amor."],
  ["Colosenses 1:17", "Y él es antes de todas las cosas, y por él todas las cosas subsisten:"],
  ["Apocalipsis 1:8", "Yo soy el Alpha y la Omega, principio y fin, dice el Señor, que es y que era y que ha de venir, el Todopoderoso."],
  ["Juan 6:37", "Todo lo que el Padre me da, vendrá á mí; y al que á mí viene, no le hecho fuera."],
  ["1 Juan 4:19", "Nosotros le amamos á él, porque él nos amó primero."],
  ["Filipenses 1:6", "Estando confiado de esto, que el que comenzó en vosotros la buena obra, la perfeccionará hasta el día de Jesucristo;"],
  ["Marcos 9:23", "Y Jesús le dijo: Si puedes creer, al que cree todo es posible."],
  ["Efesios 5:20", "Dando gracias siempre de todo al Dios y Padre en el nombre de nuestro Señor Jesucristo:"],
  ["Juan 20:29", "Dícele Jesús: Porque me has visto, Tomás, creiste: bienaventurados los que no vieron y creyeron."],
  ["1 Pedro 1:8", "Al cual, no habiendo visto, le amáis; en el cual creyendo, aunque al presente no lo veáis, os alegráis con gozo inefable y glorificado;"],
  ["Juan 3:30", "A él conviene crecer, mas á mí menguar."],
  ["Romanos 8:26", "Y asimismo también el Espíritu ayuda nuestra flaqueza: porque qué hemos de pedir como conviene, no lo sabemos; sino que el mismo Espíritu pide por nosotros con gemidos indecibles."],
  ["2 Corintios 4:16", "Por tanto, no desmayamos: antes aunque este nuestro hombre exterior se va desgastando, el interior empero se renueva de día en día."],
  ["1 Corintios 1:18", "Porque la palabra de la cruz es locura á los que se pierden; mas á los que se salvan, es á saber, á nosotros, es potencia de Dios."],
  ["Mateo 19:26", "Y mirándo los Jesús, les dijo: Para con los hombres imposible es esto; mas para con Dios todo es posible."],
  ["Hebreos 13:5", "Sean las costumbres vuestras sin avaricia; contentos de lo presente; porque él dijo: No te desampararé, ni te dejaré."],
  ["Romanos 5:3-4", "Y no sólo esto, mas aun nos gloriamos en las tribulaciones, sabiendo que la tribulación produce paciencia; y la paciencia, prueba; y la prueba, esperanza;"],
  ["Lucas 11:9", "Y yo os digo: Pedid, y se os dará; buscad, y hallaréis; llamad, y os será abierto."],
  ["Efesios 6:11", "Vestíos de toda la armadura de Dios, para que podáis estar firmes contra las asechanzas del diablo."],
  ["Mateo 22:37-39", "Y Jesús le dijo: Amarás al Señor tu Dios de todo tu corazón, y de toda tu alma, y de toda tu mente. Este es el primero y el grande mandamiento. Y el segundo es semejante á éste: Amarás á tu prójimo como á ti mismo."],
  ["1 Pedro 5:7", "Echando toda vuestra solicitud en él, porque él tiene cuidado de vosotros."],
  ["Hebreos 11:6", "Empero sin fe es imposible agradar á Dios; porque es menester que el que á Dios se allega, crea que le hay, y que es galardonador de los que le buscan."],
  ["Romanos 6:23", "Porque la paga del pecado es muerte: mas la dádiva de Dios es vida eterna en Cristo Jesús Señor nuestro."],
  ["Efesios 2:8-9", "Porque por gracia sois salvos por la fe; y esto no de vosotros, pues es don de Dios: No por obras, para que nadie se gloríe."],
  ["Judas 1:20-21", "Mas vosotros, oh amados, edificándoos sobre vuestra santísima fe, orando por el Espíritu Santo, conservaos en el amor de Dios, esperando la misericordia de nuestro Señor Jesucristo, para vida eterna."],
  ["Judas 1:24-25", "A aquel, pues, que es poderoso para guardaros sin caída, y presentaros delante de su gloria irreprensibles, con grande alegría, al Dios solo sabio, nuestro Salvador, sea gloria y magnificencia, imperio y potencia, ahora y en todos los siglos. Amén."],
  ["1 Corintios 15:57", "Mas á Dios gracias, que nos da la victoria por el Señor nuestro Jesucristo."],
  ["Juan 7:38", "El que cree en mí, como dice la Escritura, ríos de agua viva correrán de su vientre."],
  ["Romanos 10:10", "Porque con el corazón se cree para justicia; mas con la boca se hace confesión para salud."],
  ["Apocalipsis 7:17", "Porque el Cordero que está en medio del trono los pastoreará, y los guiará á fuentes vivas de aguas: y Dios limpiará toda lágrima de los ojos de ellos."],
  ["Juan 14:1", "No se turbe vuestro corazón: creéis en Dios, creed también en mí."],
  ["Santiago 1:5", "Y si alguno de vosotros tiene falta de sabiduría, demándela á Dios, el cual da á todos abundantemente, y no zahiere; y le será dada."],
  ["Gálatas 6:9", "No nos cansemos, pues, de hacer bien; que á su tiempo segaremos, si no hubiéremos desmayado."],
  ["1 Corintios 15:58", "Así que, hermanos míos amados, estad firmes y constantes, creciendo en la obra del Señor siempre, sabiendo que vuestro trabajo en el Señor no es vano."],
  ["Colosenses 3:16", "La palabra de Cristo habite en vosotros en abundancia en toda sabiduría, enseñándoos y exhortándoos los unos á los otros con salmos é himnos y canciones espirituales, con gracia cantando en vuestros corazones al Señor."],
  ["Colosenses 2:6-7", "Por tanto, de la manera que habéis recibido al Señor Jesucristo, andad en él: Arraigados y sobreedificados en él, y confirmados en la fe, así como habéis aprendido, creciendo en ella con hacimiento de gracias."],
  ["Apocalipsis 22:13", "Yo soy Alpha y Omega, principio y fin, el primero y el postrero."],
  ["Mateo 5:16", "Así alumbre vuestra luz delante de los hombres, para que vean vuestras obras buenas, y glorifiquen á vuestro Padre que está en los cielos."],
  ["1 Juan 5:14", "Y esta es la confianza que tenemos en él, que si demandáremos alguna cosa conforme á su voluntad, él nos oye."],
  ["Mateo 16:24", "Entonces Jesús dijo á sus discípulos: Si alguno quiere venir en pos de mí, niéguese á sí mismo, y tome su cruz, y sígame."],
  ["Lucas 16:10", "El que es fiel en lo muy poco, también en lo más es fiel: y el que en lo muy poco es injusto, también en lo más es injusto."],
  ["Juan 14:13-14", "Y todo lo que pidiereis al Padre en mi nombre, esto haré, para que el Padre sea glorificado en el Hijo. Si algo pidiereis en mi nombre, yo lo haré."],
  ["1 Juan 1:9", "Si confesamos nuestros pecados, él es fiel y justo para que nos perdone nuestros pecados, y nos limpie de toda maldad."],
  ["1 Corintios 3:16", "¿No sabéis que sois templo de Dios, y que el Espíritu de Dios mora en vosotros?"],
  ["Mateo 7:1", "No juzguéis, para que no seáis juzgados."],
  ["Filipenses 2:13", "Porque Dios es el que en vosotros obra así el querer como el hacer, por su buena voluntad."],
  ["Romanos 12:1", "Así que, hermanos, os ruego por las misericordias de Dios, que presentéis vuestros cuerpos en sacrificio vivo, santo, agradable á Dios, que es vuestro racional culto."],
  ["Apocalipsis 22:17", "Y el Espíritu y la Esposa dicen: Ven. Y el que oye, diga: Ven. Y el que tiene sed, venga: y el que quiere, tome del agua de la vida de balde."],
  ["2 Corintios 5:15", "Y por todos murió, para que los que viven, ya no vivan para sí, mas para aquel que murió y resucitó por ellos."],
  ["Mateo 4:4", "Mas él respondiendo, dijo: Escrito está: No con solo el pan vivirá el hombre, mas con toda palabra que sale de la boca de Dios."],
  ["Mateo 7:12", "Así que, todas las cosas que quisierais que los hombres hiciesen con vosotros, así también haced vosotros con ellos; porque esta es la ley y los profetas."],
  ["Mateo 5:4", "Bienaventurados los que lloran: porque ellos recibirán consolación."],
  ["1 Tesalonicenses 5:24", "Fiel es el que os ha llamado; el cual también lo hará."],
  ["Mateo 28:19-20", "Por tanto, id, y doctrinad á todos los Gentiles, bautizándolos en el nombre del Padre, y del Hijo, y del Espíritu Santo: Enseñándoles que guarden todas las cosas que os he mandado: y he aquí, yo estoy con vosotros todos los días, hasta el fin del mundo. Amén."],
  ["Juan 17:17", "Santifícalos en tu verdad: tu palabra es verdad."],
  ["1 Pedro 1:24-25", "Porque Toda carne es como la hierba, y toda la gloria del hombre como la flor de la hierba: secóse la hierba, y la flor se cayó; mas la palabra del Señor permanece perpetuamente. Y esta es la palabra que por el evangelio os ha sido anunciada."],
  ["Gálatas 6:2", "Sobrellevad los unos las cargas de los otros; y cumplid así la ley de Cristo."],
  ["Lucas 2:14", "Gloria en las alturas á Dios, y en la tierra paz, buena voluntad para con los hombres."],
  ["Mateo 7:13-14", "Entrad por la puerta estrecha: porque ancha es la puerta, y espacioso el camino que lleva á perdición, y muchos son los que entran por ella. Porque estrecha es la puerta, y angosto el camino que lleva á la vida, y pocos son los que la hallan."],
  ["Juan 14:15", "Si me amáis, guardad mis mandamientos;"],
  ["Romanos 8:14", "Porque todos los que son guiados por el Espíritu de Dios, los tales son hijos de Dios."],
  ["Colosenses 3:12", "Vestíos pues, como escogidos de Dios, santos y amados, de entrañas de misericordia, de benignidad, de humildad, de mansedumbre, de tolerancia;"],
  ["Juan 1:4-5", "En él estaba la vida, y la vida era la luz de los hombres. Y la luz en las tinieblas resplandece; mas las tinieblas no la comprendieron."],
  ["1 Corintios 13:8", "La caridad nunca deja de ser: mas las profecías se han de acabar, y cesarán las lenguas, y la ciencia ha de ser quitada;"],
  ["Hebreos 12:14", "Seguid la paz con todos, y la santidad, sin la cual nadie verá al Señor:"],
  ["1 Corintios 2:5", "Para que vuestra fe no esté fundada en sabiduría de hombres, mas en poder de Dios."],
  ["1 Juan 4:18", "En amor no hay temor; mas el perfecto amor echa fuera el temor: porque el temor tiene pena. De donde el que teme, no está perfecto en el amor."],
  ["2 Pedro 3:18", "Mas creced en la gracia y conocimiento de nuestro Señor y Salvador Jesucristo. A él sea gloria ahora y hasta el día de la eternidad. Amén."],
  ["Hechos 1:8", "Mas recibiréis la virtud del Espíritu Santo que vendrá sobre vosotros; y me sereís testigos en Jerusalem, y en toda Judea, y Samaria, y hasta lo último de la tierra."],
  ["1 Juan 4:10", "En esto consiste el amor: no que nosotros hayamos amado á Dios, sino que él nos amó á nosotros, y ha enviado á su Hijo en propiciación por nuestros pecados."],
  ["1 Juan 4:16", "Y nosotros hemos conocido y creído el amor que Dios tiene para con nosotros. Dios es amor; y el que vive en amor, vive en Dios, y Dios en él."],
  ["Hechos 17:28", "Porque en él vivimos, y nos movemos, y somos; como también algunos de vuestros poetas dijeron: Porque linaje de éste somos también."],
  ["Hebreos 2:18", "Porque en cuanto él mismo padeció siendo tentado, es poderoso para socorrer á los que son tentados."],
  ["Romanos 8:31", "¿Pues qué diremos á esto? Si Dios por nosotros, ¿quién contra nosotros?"],
  ["Santiago 4:10", "Humillaos delante del Señor, y él os ensalzará."],
  ["Efesios 4:15", "Antes siguiendo la verdad en amor, crezcamos en todas cosas en aquel que es la cabeza, á saber, Cristo;"],
  ["2 Corintios 9:8", "Y poderoso es Dios para hacer que abunde en vosotros toda gracia; á fin de que, teniendo siempre en todas las cosas todo lo que basta, abundéis para toda buena obra:"],
  ["2 Corintios 4:6", "Porque Dios, que mandó que de las tinieblas resplandeciese la luz, es el que resplandeció en nuestros corazones, para iluminación del conocimiento de la gloria de Dios en la faz de Jesucristo."],
  ["Hechos 5:29", "Y respondiendo Pedro y los apóstoles, dijeron: Es menester obedecer á Dios antes que á los hombres."],
  ["1 Pedro 3:8", "Y finalmente, sed todos de un mismo corazón, compasivos, amándoos fraternalmente, misericordiosos, amigables;"],
  ["Efesios 6:10", "Por lo demás, hermanos míos, confortaos en el Señor, y en la potencia de su fortaleza."],
  ["1 Juan 3:18", "Hijitos míos, no amemos de palabra ni de lengua, sino de obra y en verdad."],
  ["1 Pedro 2:24", "El cual mismo llevó nuestros pecados en su cuerpo sobre el madero, para que nosotros siendo muertos á los pecados, vivamos á la justicia: por la herida del cual habéis sido sanados."],
  ["1 Corintios 13:2", "Y si tuviese profecía, y entendiese todos los misterios y toda ciencia; y si tuviese toda la fe, de tal manera que traspasase los montes, y no tengo caridad, nada soy."],
  ["Romanos 14:8", "Que si vivimos, para el Señor vivimos; y si morimos, para el Señor morimos. Así que, ó que vivamos, ó que muramos, del Señor somos."],
  ["Mateo 6:24", "Ninguno puede servir á dos señores; porque ó aborrecerá al uno y amará al otro, ó se llegará al uno y menospreciará al otro: no podéis servir á Dios y á Mammón."],
  ["Filipenses 4:8", "Por lo demás, hermanos, todo lo que es verdadero, todo lo honesto, todo lo justo, todo lo puro, todo lo amable, todo lo que es de buen nombre; si hay virtud alguna, si alguna alabanza, en esto pensad."],
  ["1 Timoteo 6:12", "Pelea la buena batalla de la fe, echa mano de la vida eterna, á la cual asimismo eres llamado, habiendo hecho buena profesión delante de muchos testigos."],
  ["Colosenses 4:2", "Perseverad en oración, velando en ella con hacimiento de gracias:"],
  ["1 Timoteo 1:15", "Palabra fiel y digna de ser recibida de todos: que Cristo Jesús vino al mundo para salvar á los pecadores, de los cuales yo soy el primero."],
  ["Romanos 8:37", "Antes, en todas estas cosas hacemos más que vencer por medio de aquel que nos amó."],
  ["Juan 15:16", "No me elegisteis vosotros á mí, mas yo os elegí á vosotros; y os he puesto para que vayáis y llevéis fruto, y vuestro fruto permanezca: para que todo lo que pidiereis del Padre en mi nombre, él os lo dé."],
  ["2 Corintios 12:9", "Y me ha dicho: Bástate mi gracia; porque mi potencia en la flaqueza se perfecciona. Por tanto, de buena gana me gloriaré más bien en mis flaquezas, porque habite en mí la potencia de Cristo."],
  ["1 Timoteo 4:8", "Porque el ejercicio corporal para poco es provechoso; mas la piedad para todo aprovecha, pues tiene promesa de esta vida presente, y de la venidera."],
  ["3 Juan 1:11", "Amado, no sigas lo que es malo, sino lo que es bueno. El que hace bien es de Dios: mas el que hace mal, no ha visto á Dios."],
  ["Juan 5:24", "De cierto, de cierto os digo: El que oye mi palabra, y cree al que me ha enviado, tiene vida eterna; y no vendrá á condenación, mas pasó de muerte á vida."],
  ["Mateo 6:21", "Porque donde estuviere vuestro tesoro, allí estará vuestro corazón."],
  ["Mateo 5:5", "Bienaventurados los mansos: porque ellos recibirán la tierra por heredad."],
  ["Romanos 10:17", "Luego la fe es por el oir; y el oir por la palabra de Dios."],

function pad(n){ return n < 10 ? '0' + n : '' + n; }

function dayOfYear(d){
  const start = new Date(d.getFullYear(), 0, 0);
  const diff = d - start;
  return Math.floor(diff / 86400000);
}

function render(index){
  const [ref, text] = verses[index];
  document.getElementById('verse').innerHTML =
    '<span class="dropcap">' + text.charAt(0) + '</span>' + text.slice(1);
  document.getElementById('reference').textContent = ref;
}

const today = new Date();
const weekdays = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
document.getElementById('weekday').textContent = weekdays[today.getDay()];
document.getElementById('daynum').textContent = pad(today.getDate()) + ' / ' + pad(today.getMonth() + 1);

let currentIndex = dayOfYear(today) % verses.length;
render(currentIndex);

document.getElementById('refresh').addEventListener('click', function(){
  let next = Math.floor(Math.random() * verses.length);
  if (verses.length > 1 && next === currentIndex) {
    next = (next + 1) % verses.length;
  }
  currentIndex = next;
  render(currentIndex);
});
</script>
