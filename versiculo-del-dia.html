<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Versículo del día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#12141c;
    --ink-800:#1c2029;
    --ink-700:#2a2f3b;
    --parchment:#eee6d6;
    --parchment-dim:#c9c0ab;
    --gold:#c9a45c;
    --gold-soft:#e2c88a;
    --ember:#8b3a3a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 60% 45% at 50% 18%, rgba(201,164,92,0.10), transparent 60%),
      var(--ink-900);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
  }
  @media (prefers-reduced-motion: no-preference){
    .flame{animation:flicker 3.2s ease-in-out infinite;}
  }
  @keyframes flicker{
    0%,100%{opacity:.55; transform:scale(1);}
    35%{opacity:.85; transform:scale(1.06);}
    60%{opacity:.65; transform:scale(0.97);}
    80%{opacity:.9; transform:scale(1.03);}
  }
  .page{
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--parchment-dim);
    margin-bottom:28px;
  }
  .seal{
    position:relative;
    width:104px;
    height:104px;
    border-radius:50%;
    border:1px solid rgba(201,164,92,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:30px;
  }
  .seal::before{
    content:'';
    position:absolute;
    inset:-14px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(201,164,92,0.35), transparent 70%);
    filter:blur(2px);
  }
  .seal .flame{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(226,200,138,0.55), transparent 65%);
  }
  .seal-date{
    position:relative;
    z-index:1;
    font-family:'Fraunces',serif;
    font-size:15px;
    font-weight:600;
    color:var(--gold-soft);
    line-height:1.15;
  }
  .seal-date span{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:9px;
    letter-spacing:.18em;
    font-weight:500;
    color:var(--parchment-dim);
    margin-bottom:3px;
    text-transform:uppercase;
  }
  .verse-wrap{
    position:relative;
    padding:6px 4px 0;
  }
  .dropcap{
    float:left;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:64px;
    line-height:.78;
    padding:6px 8px 0 0;
    background:linear-gradient(160deg, var(--gold-soft), var(--gold) 55%, var(--ember) 130%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .verse{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:400;
    font-size:23px;
    line-height:1.5;
    color:var(--parchment);
    text-align:left;
  }
  .verse::after{content:'';display:block;clear:both;}
  .rule{
    width:46px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    margin:26px 0 16px;
  }
  .reference{
    font-family:'Inter',sans-serif;
    font-size:13px;
    letter-spacing:.06em;
    color:var(--gold-soft);
    font-weight:500;
  }
  .note{
    margin-top:34px;
    font-size:11.5px;
    line-height:1.6;
    color:var(--parchment-dim);
    max-width:360px;
  }
  .refresh{
    margin-top:22px;
    background:none;
    border:1px solid rgba(238,230,214,0.18);
    color:var(--parchment-dim);
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:.03em;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color .2s ease, color .2s ease;
  }
  .refresh:hover, .refresh:focus-visible{
    border-color:rgba(201,164,92,0.6);
    color:var(--gold-soft);
    outline:none;
  }
  .refresh:focus-visible{box-shadow:0 0 0 3px rgba(201,164,92,0.25);}
</style>
</head>
<body>
  <main class="page">
    <div class="eyebrow">Nuevo Testamento</div>
    <div class="seal">
      <div class="flame"></div>
      <div class="seal-date"><span id="weekday"></span><span id="daynum"></span></div>
    </div>
    <div class="verse-wrap">
      <p class="verse" id="verse"></p>
    </div>
    <div class="rule"></div>
    <p class="reference" id="reference"></p>
    <button class="refresh" id="refresh" aria-label="Ver otro versículo al azar">Ver otro versículo</button>
    <p class="note">Texto literal de la Biblia Reina-Valera 1909 (dominio público), con su ortografía original.</p>
  </main>

  ["2 Tesalonicenses 3:3", "Mas fiel es el Señor, que os confirmará y guardará del mal."],
  ["1 Timoteo 4:12", "Ninguno tenga en poco tu juventud; pero sé ejemplo de los fieles en palabra, en conversación, en caridad, en espíritu, en fe, en limpieza."],
  ["2 Timoteo 4:7", "He peleado la buena batalla, he acabado la carrera, he guardado la fe."],
  ["Tito 3:5", "No por obras de justicia que nosotros habíamos hecho, mas por su misericordia nos salvó, por el lavacro de la regeneración, y de la renovación del Espíritu Santo;"],
  ["Hebreos 4:16", "Lleguémonos pues confiadamente al trono de la gracia, para alcanzar misericordia, y hallar gracia para el oportuno socorro."],
  ["Hebreos 12:1-2", "Por tanto nosotros también, teniendo en derredor nuestro una tan grande nube de testigos, dejando todo el peso del pecado que nos rodea, corramos con paciencia la carrera que nos es propuesta, puestos los ojos en al autor y consumador de la fe, en Jesús; el cual, habiéndole sido propuesto gozo, sufrió la cruz, menospreciando la vergüenza, y sentóse á la diestra del trono de Dios."],
  ["Hebreos 13:8", "Jesucristo es el mismo ayer, y hoy, y por los siglos."],
  ["Santiago 1:2", "Hermanos míos, tened por sumo gozo cuando cayereis en diversas tentaciones;"],
  ["Santiago 4:8", "Allegaos á Dios, y él se allegará á vosotros. Pecadores, limpiad las manos; y vosotros de doblado ánimo, purificad los corazones."],

  ["3 Juan 1:2", "Amado, yo deseo que tú seas prosperado en todas cosas, y que tengas salud, así como tu alma está en prosperidad."],

function pad(n){ return n < 10 ? '0' + n : '' + n; }

function dayOfYear(d){
  const start = new Date(d.getFullYear(), 0, 0);
  const diff = d - start;
  return Math.floor(diff / 86400000);
}

function render(index){
  const [ref, text] = verses[index];
  document.getElementById('verse').innerHTML =
    '<span class="dropcap">' + text.charAt(0) + '</span>' + text.slice(1);
  document.getElementById('reference').textContent = ref;
}

const today = new Date();
const weekdays = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
document.getElementById('weekday').textContent = weekdays[today.getDay()];
document.getElementById('daynum').textContent = pad(today.getDate()) + ' / ' + pad(today.getMonth() + 1);

let currentIndex = dayOfYear(today) % verses.length;
render(currentIndex);

document.getElementById('refresh').addEventListener('click', function(){
  let next = Math.floor(Math.random() * verses.length);
  if (verses.length > 1 && next === currentIndex) {
    next = (next + 1) % verses.length;
  }
  currentIndex = next;
  render(currentIndex);
});
</script>
</body>
</html>
